<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CQA — контроль качества диалогов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;600&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Строгий инструмент: светлый сайдбар, плотные таблицы, один зелёный акцент, цвет = статус */
:root{
  --bg:oklch(0.975 0.004 155); --surface:oklch(0.995 0.002 155); --sunken:oklch(0.955 0.006 155);
  --line:oklch(0.905 0.008 155); --line-2:oklch(0.83 0.01 155);
  --fg:oklch(0.23 0.014 155); --fg-2:oklch(0.42 0.014 155); --fg-3:oklch(0.52 0.012 155);
  --accent:oklch(0.5 0.12 155); --accent-hover:oklch(0.44 0.11 155); --accent-weak:oklch(0.945 0.035 155); --on-accent:oklch(0.99 0.01 155);
  --ok:oklch(0.47 0.11 150); --ok-bg:oklch(0.95 0.035 150);
  --bad:oklch(0.5 0.17 28); --bad-bg:oklch(0.955 0.028 28);
  --warn:oklch(0.5 0.11 62); --warn-bg:oklch(0.955 0.045 80);
  --info:oklch(0.47 0.11 252); --info-bg:oklch(0.955 0.022 252);
  --na-bg:oklch(0.93 0.005 155); --mark:oklch(0.94 0.06 95); --mark-strong:oklch(0.89 0.09 92);
  --display:"Geologica","Segoe UI",system-ui,sans-serif; --body:"Golos Text","Segoe UI",system-ui,sans-serif;
  --t-xs:13px; --t-sm:14px; --t-md:15px; --t-lg:19px; --t-xl:24px; --t-2xl:30px;
  --s-xs:4px; --s-sm:8px; --s-md:12px; --s-lg:16px; --s-xl:24px; --s-2xl:32px; --s-3xl:48px;
  --r:6px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:oklch(0.18 0.008 155); --surface:oklch(0.21 0.008 155); --sunken:oklch(0.165 0.008 155);
  --line:oklch(0.3 0.01 155); --line-2:oklch(0.38 0.012 155);
  --fg:oklch(0.93 0.008 155); --fg-2:oklch(0.79 0.01 155); --fg-3:oklch(0.68 0.01 155);
  --accent:oklch(0.74 0.13 155); --accent-hover:oklch(0.8 0.12 155); --accent-weak:oklch(0.3 0.05 155); --on-accent:oklch(0.18 0.02 155);
  --ok:oklch(0.78 0.12 150); --ok-bg:oklch(0.3 0.05 150); --bad:oklch(0.75 0.13 28); --bad-bg:oklch(0.3 0.06 28);
  --warn:oklch(0.82 0.11 75); --warn-bg:oklch(0.32 0.05 70); --info:oklch(0.77 0.09 252); --info-bg:oklch(0.3 0.05 252);
  --na-bg:oklch(0.28 0.008 155); --mark:oklch(0.36 0.06 95); --mark-strong:oklch(0.44 0.08 92); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:400 var(--t-sm)/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;letter-spacing:-.01em}
h1{font-size:var(--t-xl);line-height:1.2} h2{font-size:var(--t-lg);line-height:1.3} h3{font-size:var(--t-md)}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--fg-3)} .sm{font-size:var(--t-xs)}
.hidden{display:none!important}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100vh}
.side{background:var(--sunken);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:var(--s-lg) var(--s-md);gap:var(--s-xs);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 var(--s-sm) var(--s-lg)}
.mark{width:28px;height:28px;border-radius:6px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:600 11px var(--display);letter-spacing:.04em}
.brand b{font:600 var(--t-sm) var(--display);display:block}
.brand span{font-size:12.5px;color:var(--fg-3)}
.nav-g{font-size:12px;color:var(--fg-3);padding:var(--s-md) var(--s-sm) var(--s-xs);letter-spacing:.04em;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:var(--s-sm);padding:7px var(--s-sm);border-radius:var(--r);color:var(--fg-2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface);color:var(--fg)}
.nav a.on{background:var(--surface);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.nav .cnt{margin-left:auto;font-size:12px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.nav .cnt.hot{color:var(--bad);font-weight:600}
.side .foot{margin-top:auto;padding:var(--s-md) var(--s-sm) 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--fg-3)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{height:52px;flex:none;display:flex;align-items:center;gap:var(--s-lg);padding:0 var(--s-xl);border-bottom:1px solid var(--line);background:var(--surface)}
.crumbs{font-size:var(--t-sm);color:var(--fg-3);display:flex;gap:6px;align-items:center;min-width:0}
.crumbs a{color:var(--fg-3);text-decoration:none}.crumbs a:hover{color:var(--fg)}
.crumbs b{color:var(--fg);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.demo{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--fg-3)}
.demo select{height:30px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);padding:0 6px;font-size:13px}
.ib{position:relative;width:34px;height:34px;border-radius:var(--r);border:1px solid transparent;background:none;cursor:pointer;display:grid;place-items:center;color:var(--fg-2)}
.ib:hover{background:var(--sunken)}
.ib .badge{position:absolute;top:3px;right:3px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:var(--on-accent);font-size:11px;line-height:16px;font-weight:600;padding:0 4px}
.who{display:flex;align-items:center;gap:var(--s-sm);font-size:13px;cursor:pointer;background:none;border:0;padding:4px 6px;border-radius:var(--r)}
.who:hover{background:var(--sunken)}
.ava{width:28px;height:28px;border-radius:50%;background:var(--accent-weak);color:var(--accent);display:grid;place-items:center;font:600 11.5px var(--display)}
.who small{display:block;color:var(--fg-3);font-size:12px;line-height:1.2}
.pop{position:absolute;right:var(--s-xl);top:48px;width:340px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 32px -12px oklch(0.2 0.02 155 / .25);z-index:20;padding:var(--s-sm)}
.pop .it{padding:var(--s-sm);border-radius:var(--r);font-size:13.5px;display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;color:var(--fg)}
.pop .it:hover{background:var(--sunken)}
.pop .it small{display:block;color:var(--fg-3);font-size:12px}
.view{flex:1;overflow:auto;padding:var(--s-xl) var(--s-xl) var(--s-3xl)}
.view.flush{padding:0;overflow:hidden;display:flex;flex-direction:column}

/* page head */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s-lg);margin-bottom:var(--s-xl);flex-wrap:wrap}
.ph p{color:var(--fg-2);max-width:72ch;margin-top:6px}
.acts{display:flex;gap:var(--s-sm);flex-wrap:wrap;align-items:center}

/* controls */
.btn{height:34px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--fg)}
.btn:hover{background:var(--sunken)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{color:var(--bad)}
.btn.sm{height:28px;padding:0 10px;font-size:13px}
.btn.link{border-color:transparent;background:none;color:var(--accent);padding:0 6px}
.btn.link:hover{text-decoration:underline;background:none}
.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
input.f,select.f,textarea.f{width:100%;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);padding:7px 10px;font-size:var(--t-sm)}
textarea.f{resize:vertical;min-height:72px;line-height:1.5}
input.f:focus,select.f:focus,textarea.f:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
label.l{display:block;font-size:13px;font-weight:500;color:var(--fg-2);margin:var(--s-md) 0 6px}
.err{color:var(--bad);font-size:13px;margin-top:4px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;border-right:1px solid var(--line);background:none;padding:4px 11px;font-size:13px;cursor:pointer;min-width:40px;font-variant-numeric:tabular-nums;color:var(--fg-2)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--sunken)}
.seg button.on{background:var(--fg);color:var(--surface);font-weight:600}
.seg button sup{font-size:9.5px;margin-left:2px;color:inherit;opacity:.7}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:30px;padding:0 12px;border:1px solid var(--line-2);border-radius:15px;background:var(--surface);font-size:13px;cursor:pointer;color:var(--fg-2)}
.chip.on{border-color:var(--fg);background:var(--fg);color:var(--surface);font-weight:500}
.chip .c{margin-left:4px;opacity:.7}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;padding:0 8px;border-radius:4px;line-height:22px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.info{background:var(--info-bg);color:var(--info)}
.pill.na{background:var(--na-bg);color:var(--fg-2)} .pill.acc{background:var(--accent-weak);color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

/* tables */
.tw{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:auto}
table.t{width:100%;border-collapse:collapse;font-size:var(--t-sm)}
.t th{text-align:left;font-weight:500;font-size:12.5px;color:var(--fg-3);padding:9px var(--s-md);border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0}
.t td{padding:10px var(--s-md);border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tr.go{cursor:pointer}.t tr.go:hover td{background:var(--sunken)}
.t tr.sel td{background:var(--accent-weak)}
.t .r{text-align:right} .t .id{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.t .sub{display:block;font-size:12.5px;color:var(--fg-3)}
.score{font:600 var(--t-sm) var(--display);font-variant-numeric:tabular-nums}
.score.hi{color:var(--ok)}.score.mid{color:var(--warn)}.score.lo{color:var(--bad)}
.empty{padding:var(--s-3xl) var(--s-xl);text-align:left;color:var(--fg-2)}
.empty h3{margin-bottom:6px;color:var(--fg)}

/* stat strip */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:var(--s-xl)}
.strip div{padding:var(--s-md) var(--s-lg);border-right:1px solid var(--line)}
.strip div:last-child{border-right:0}
.strip .l{font-size:12.5px;color:var(--fg-3)}
.strip .v{font:600 var(--t-xl)/1.25 var(--display);font-variant-numeric:tabular-nums}
.strip .d{font-size:12.5px;color:var(--fg-3)}
.filters{display:flex;gap:var(--s-sm);flex-wrap:wrap;margin-bottom:var(--s-md);align-items:center}
.filters select,.filters input{height:32px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);padding:0 8px;font-size:13.5px}
.filters input{width:220px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s-xl)}
.cols.w{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.sec{margin-bottom:var(--s-2xl)}
.sec>h2{margin-bottom:var(--s-md)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:var(--s-lg) var(--s-xl)}
.note{background:var(--info-bg);color:var(--fg);border-radius:var(--r);padding:10px 14px;font-size:13.5px}
.note.warn{background:var(--warn-bg)} .note.ok{background:var(--ok-bg)} .note.bad{background:var(--bad-bg)}
.bars{display:grid;gap:2px}
.bar{display:grid;grid-template-columns:minmax(150px,240px) minmax(0,1fr) 54px;gap:var(--s-md);align-items:center;padding:6px 8px;border-radius:var(--r);cursor:pointer;border:0;background:none;text-align:left;font-size:var(--t-sm);color:var(--fg)}
.bar:hover{background:var(--sunken)}
.bar .tr{height:8px;background:var(--na-bg);border-radius:4px;overflow:hidden}
.bar .fl{height:100%;background:var(--bad)}
.bar .fl.m{background:var(--warn)} .bar .fl.l{background:var(--fg-3)}

/* dialog workspace */
.dh{padding:var(--s-lg) var(--s-xl);border-bottom:1px solid var(--line);background:var(--surface);display:flex;gap:var(--s-xl);align-items:center;flex-wrap:wrap}
.dh .t1{display:flex;align-items:center;gap:var(--s-sm);flex-wrap:wrap}
.meta{display:flex;gap:var(--s-xl);flex-wrap:wrap;font-size:13.5px}
.meta span{display:block;font-size:12px;color:var(--fg-3)}
.ws{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 480px;min-height:0}
.chat{overflow:auto;padding:var(--s-lg) var(--s-xl) var(--s-3xl);background:var(--bg)}
.chat .tl{display:flex;gap:var(--s-md);align-items:center;font-size:13px;color:var(--fg-3);margin-bottom:var(--s-md);flex-wrap:wrap}
.msg{display:grid;grid-template-columns:40px 92px minmax(0,1fr);gap:var(--s-md);padding:8px 10px;border-radius:var(--r);font-size:var(--t-sm);scroll-margin:120px;border:1px solid transparent}
.msg .n{font-size:12.5px;color:var(--fg-3);font-variant-numeric:tabular-nums;padding-top:1px}
.msg .w{font-size:12.5px;color:var(--fg-3);line-height:1.35;padding-top:1px}
.msg .w b{display:block;font-weight:600;color:var(--fg-2);font-size:13px}
.msg.op .w b{color:var(--accent)}
.msg.ctx{color:var(--fg-3)}
.msg.ev{background:var(--mark);border-color:var(--mark-strong)}
.msg.flash{background:var(--mark-strong)}
.sys{display:flex;align-items:center;gap:var(--s-md);margin:10px 0;font-size:12.5px;color:var(--fg-3);scroll-margin:120px}
.sys::before,.sys::after{content:"";flex:1;height:1px;background:var(--line)}
.sys.esc{color:var(--accent);font-weight:500}
.sys.esc::before,.sys.esc::after{background:var(--accent)}
.sys.ev{color:var(--fg);font-weight:600}
.ap{display:flex;flex-direction:column;min-height:0;background:var(--surface);border-left:1px solid var(--line)}
.ap .sum{padding:var(--s-lg) var(--s-xl);border-bottom:1px solid var(--line)}
.total{display:flex;align-items:baseline;gap:var(--s-sm);flex-wrap:wrap}
.total .big{font:600 var(--t-2xl)/1.1 var(--display);font-variant-numeric:tabular-nums}
.formula{font-size:12.5px;color:var(--fg-3);margin-top:4px}
.secs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:var(--s-md)}
.secs div{background:var(--surface);padding:7px 10px;font-size:12px;color:var(--fg-3);line-height:1.3}
.secs b{display:block;color:var(--fg);font:600 var(--t-sm) var(--display);font-variant-numeric:tabular-nums;margin-top:2px}
.ap .list{flex:1;overflow:auto}
.sh{font-size:12px;color:var(--fg-3);padding:var(--s-md) var(--s-xl) 6px;letter-spacing:.04em;text-transform:uppercase}
.cr{border-top:1px solid var(--line);padding:var(--s-md) var(--s-xl)}
.cr>.hd{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;cursor:pointer;background:none;border:0;width:100%;text-align:left;padding:0;color:var(--fg)}
.cr .no{font-size:12.5px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.cr .nm{font-weight:500}
.cr .pts{font-size:12.5px;color:var(--fg-3);font-variant-numeric:tabular-nums;margin-left:32px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:4px}
.cr.open{background:var(--sunken)}
.cr .body{margin:10px 0 4px 32px;display:grid;gap:10px}
.cr .why{color:var(--fg-2);font-size:var(--t-sm)}
.evc{font-size:12.5px;border:1px solid var(--line-2);background:var(--surface);border-radius:4px;padding:0 6px;cursor:pointer;line-height:21px;font-variant-numeric:tabular-nums;color:var(--fg)}
.evc:hover{border-color:var(--accent);color:var(--accent)}
.conf{display:inline-flex;align-items:center;gap:6px}
.conf i{display:inline-block;width:36px;height:5px;border-radius:3px;background:var(--na-bg);overflow:hidden}
.conf i b{display:block;height:100%;background:var(--fg-3)}
.conf.low{color:var(--warn)} .conf.low i b{background:var(--warn)}
.box{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 12px;display:grid;gap:8px}
.box .h{font-size:12.5px;font-weight:600;color:var(--fg-2)}
.ap .ft{border-top:1px solid var(--line);padding:var(--s-md) var(--s-xl);display:flex;gap:var(--s-sm);align-items:center;flex-wrap:wrap}
.ap .ft .msgx{font-size:12.5px;color:var(--fg-3);margin-right:auto;flex:1 1 160px}
.pass{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:12.5px;padding:var(--s-md) var(--s-xl) var(--s-lg);color:var(--fg-3)}
.pass b{color:var(--fg-2);font-weight:500}
.hist{list-style:none;margin:0;padding:0 var(--s-xl) var(--s-lg);font-size:13px}
.hist li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:5px 0;border-top:1px solid var(--line)}
.hist li span{color:var(--fg-3);font-variant-numeric:tabular-nums}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.login .l1{padding:var(--s-3xl) clamp(24px,6vw,88px);display:flex;flex-direction:column;justify-content:center;gap:var(--s-xl);background:var(--surface);border-right:1px solid var(--line)}
.login .l2{padding:var(--s-3xl) clamp(24px,5vw,72px);display:flex;flex-direction:column;justify-content:center;gap:var(--s-lg)}
.login h1{font-size:var(--t-2xl)}
.login form{max-width:380px;display:grid;gap:2px}
.roles{display:grid;gap:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:560px;overflow:hidden}
.roles button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 16px;cursor:pointer;color:var(--fg)}
.roles button:last-child{border-bottom:0}
.roles button:hover{background:var(--sunken)}
.roles b{font-weight:600}
.roles small{grid-column:1;color:var(--fg-3);font-size:13px}
.roles em{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;font-size:13px;color:var(--accent);font-weight:500}

/* upload / job */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:var(--s-lg)}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--fg-3);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--fg)}
.drop{border:1px dashed var(--line-2);border-radius:8px;padding:var(--s-2xl);text-align:left;color:var(--fg-2);background:var(--surface)}
.prog{height:6px;background:var(--na-bg);border-radius:3px;overflow:hidden}
.prog b{display:block;height:100%;background:var(--accent);transition:width .3s cubic-bezier(.22,1,.36,1)}
.cells{display:grid;grid-template-columns:repeat(8,22px);gap:3px}
.cells i{width:22px;height:14px;border-radius:3px;background:var(--na-bg)}
.cells i.d{background:var(--accent)} .cells i.w{background:var(--warn)}

/* checklist editor */
.wsum{display:inline-flex;gap:6px;align-items:center;font-weight:500}
.t input.w{width:64px;height:30px;border:1px solid var(--line-2);border-radius:var(--r);padding:0 8px;text-align:right;background:var(--surface);font-variant-numeric:tabular-nums}
.diff{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:13.5px}
.diff div{padding:6px 10px;border-bottom:1px solid var(--line)}
.diff div:last-child{border-bottom:0}
.diff .m{background:var(--bad-bg)} .diff .p{background:var(--ok-bg)}
.toast{position:fixed;right:24px;bottom:24px;background:var(--fg);color:var(--surface);padding:10px 16px;border-radius:var(--r);font-size:13.5px;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:50;max-width:420px}
.toast.show{opacity:1;transform:none}
@media (max-width:1180px){.ws{grid-template-columns:1fr}.chat{max-height:46vh}.ap{border-left:0;border-top:1px solid var(--line)}.view.flush{overflow:auto}.cols,.cols.w{grid-template-columns:1fr}}
@media (max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}.side{flex-direction:row;padding:6px 12px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);order:2}.side .brand,.side .foot,.side .nav-g{display:none}.nav{display:flex;gap:4px}.nav a{white-space:nowrap}.main{order:1;grid-row:2}.side{grid-row:1}.who>span:last-child{display:none}.top{gap:8px}.msg{grid-template-columns:32px 64px minmax(0,1fr);gap:8px}.dh{padding:var(--s-md) var(--s-lg);gap:var(--s-md)}.meta{gap:var(--s-md)}.chat,.ap .sum,.cr,.sh,.pass,.hist,.ap .ft{padding-left:var(--s-lg);padding-right:var(--s-lg)}.secs{grid-template-columns:1fr}.pop{right:8px;width:calc(100vw - 16px)}.login{grid-template-columns:1fr}.login .l1{border-right:0;border-bottom:1px solid var(--line)}.demo span{display:none}.top{padding:0 var(--s-lg)}.view{padding:var(--s-lg)}.who small{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

<script>
window.CQA_DATA = {"checklist": {"id": "chat", "name": "Чаты", "channel": "chat", "version": 1, "status": "published", "criteria": [{"id": "c1", "code": "contact", "name": "Установление контакта", "answers": ["yes", "no"], "weight": 10, "rule": "Да — в ПЕРВОМ ответе оператор поздоровался на языке клиента И представился (назвал имя). Нет — нет приветствия, или нет имени, или не на языке клиента, или это появилось не в первом ответе. Приветствие бота не считается.", "type": "binary", "na_allowed": false}, {"id": "c2", "code": "discovery", "name": "Выявление потребности", "answers": ["yes", "no", "na"], "weight": 15, "rule": "Да — оператор учёл уже известные детали (в т.ч. сказанные боту) и уточнил недостающее до ответа. Нет — данных не хватало, а оператор ответил без уточнения, или переспросил уже известное. N/A — данных для ответа хватало с самого начала, уточнять было нечего. Не требуй уточнять детали, от которых ответ не зависит (сумму, реквизиты, сроки), — это не «Нет».", "type": "binary", "na_allowed": true}, {"id": "c3", "code": "identification", "name": "Идентификация", "answers": ["yes", "no", "na"], "weight": 20, "rule": "Да — проверка личности подтверждена ДО раскрытия данных о счёте клиента или защищённого действия (например, событие «Личность клиента подтверждена»). Нет — проверка требовалась, но не подтверждена, или данные счёта раскрыты до неё. Проверка требуется ВСЕГДА, если для правильного ответа нужно смотреть счёт клиента (его приказы, платежи, ограничения, удаление/изменение счёта) — даже если оператор в итоге ничего не раскрыл и ответил наугад. Номер телефона или имя — не идентификация. N/A — запрос не требовал смотреть счёт (общий вопрос, навигация по приложению).", "type": "binary", "na_allowed": true, "facts": ["identity_event"], "conditions": [{"id": "needs_account", "type": "bool", "question": "Нужно ли было для правильного ответа смотреть счёт этого клиента (его приказы, платежи, ограничения, баланс) или менять счёт? Общие вопросы и навигация по приложению — false."}, {"id": "disclosure_turn", "type": "turn", "question": "Номер первой реплики ОПЕРАТОРА, где он сообщил данные о счёте клиента или выполнил действие со счётом. null, если такого не было."}], "decision": [{"if": {"needs_account": false}, "then": "na"}, {"if": {"verified_before_disclosure": true}, "then": "yes"}, {"then": "no"}]}, {"id": "c4", "code": "consultation", "name": "Корректная и полная консультация", "answers": ["20", "15", "10", "5", "0", "na"], "weight": 20, "rule": "Оцени только суть ответа или следующего шага по вопросу клиента. Грубые нарушения (c8), вежливость и стиль сюда НЕ влияют — они оцениваются в других критериях. 20 — все существенные вопросы закрыты или дан корректный понятный следующий шаг (например, передал специалистам и сказал, что будет дальше; называть точный срок или сумму не обязательно, если клиент их не спрашивал); 15 — основной вопрос решён, пропущена второстепенная деталь; 10 — часть запроса закрыта, существенный вопрос остался открытым; 5 — есть общая подсказка, но клиенту всё ещё непонятно, как действовать; 0 — ответа по существу нет или ключевая рекомендация ошибочна. N/A — чат закончился до того, как клиент сформулировал запрос.", "type": "scale", "na_allowed": true}, {"id": "c5", "code": "empathy", "name": "Эмпатия и клиентоориентированность", "answers": ["yes", "no"], "weight": 15, "rule": "Да — оператор вежлив; ЕСЛИ клиент выразил недовольство, тревогу или описал неудобство — оператор отреагировал на эту конкретную проблему. Если недовольства не было, достаточно вежливости. Нет — невежливость, грубость, пренебрежение, недовольство клиента проигнорировано, или оператор предложил частную/платную услугу в обход компании (это неуважение к клиенту, даже при вежливом тоне).", "type": "binary", "na_allowed": false}, {"id": "c6", "code": "dialogue", "name": "Управление диалогом, скорость и грамотность", "answers": ["10", "7", "4", "0"], "weight": 15, "rule": "Оцени, как понятно и последовательно оператор общался (не суть решения). Время ответа и паузы между репликами НЕ оценивай — снижай только если оператор сам ушёл проверять/ждать и не предупредил клиента. 10 — ответы ясные и связные; 7 — один заметный сбой, но клиент может понять и продолжить; 4 — клиенту приходится переспрашивать из-за формулировок или порядка ответов; 0 — из-за бессвязных или противоречивых реплик ход диалога непонятен. Для звонков: логичность, понятность объяснений, отсутствие неуместных выражений, корректность речи, управление паузами.", "type": "scale", "na_allowed": false}, {"id": "c7", "code": "closure", "name": "Завершение", "answers": ["yes", "no", "na"], "weight": 5, "rule": "Да — оператор подвёл итог (например, что будет дальше) ИЛИ предложил дальнейшую помощь, И попрощался. Нет — закрыл без прощания, или только попрощался/ответил «пожалуйста», «не за что» без итога и без предложения помощи. Формальное «передам на проверку, до свидания» без того, когда и где клиент получит ответ, — не итог, это Нет. N/A — диалог оборвался до возможности завершить (обрыв связи, клиент ушёл). Событие «Оператор закрыл чат» — не обрыв.", "type": "binary", "na_allowed": true}, {"id": "c8", "code": "critical", "name": "Грубые ошибки (флаг, без баллов)", "answers": ["yes", "no"], "weight": 0, "rule": "Да — есть хотя бы одно: оскорбление клиента; предложение платной услуги в обход компании (перевести деньги оператору лично для инвестирования, оставить личный номер для частной платной консультации — достаточно самого предложения); раскрытие конфиденциальной информации (в т.ч. данных о счёте клиента без подтверждения личности). Иначе Нет.", "type": "flag", "na_allowed": false}]}, "dialogs": [{"id": "p1-ru-006", "channel": "agent chat", "lang": "RU", "operator": "Роман", "group": "Брокерские счета", "transcript": [["00:00", "client", "Пополняла со своей карты, а в приложении денег всё ещё нет."], ["00:03", "bot", "Здравствуйте! Я AIM, AI-ассистент Freedom Broker. Я могу ответить на вопросы о продуктах и услугах, предоставить информацию по вашим счетам, активам и комиссиям, сравнить данные в таблице, отправить контакты вашего менеджера и передать вопрос специалистам поддержки."], ["00:03", "bot", "Продолжая разговор, Вы соглашаетесь на сбор и обработку персональных данных и подтверждаете, что ознакомились с Политикой конфиденциальности Компании."], ["00:13", "bot", "Уточните, пожалуйста, вам нужна инструкция по пополнению или проверка уже отправленного платежа?"], ["00:52", "client", "Уже отправила. Хочу, чтобы человек проверил, подключите."], ["00:54", "bot", "Желаете, чтобы я соединил Вас с оператором?"], ["01:14", "client", "Да"], ["01:15", "bot", "Пожалуйста, ожидайте. Оператор скоро подключится к чату."], ["01:16", "system", "Эскалация на оператора."], ["03:28", "operator", "Здравствуйте, меня зовут Роман. Понимаю, что вы переживаете из-за платежа. Сначала нужно подтвердить личность, чтобы проверить счёт."], ["03:40", "client", "Готова пройти проверку."], ["03:58", "system", "Личность клиента подтверждена."], ["04:25", "operator", "Спасибо. Я передал вопрос по зачислению специалистам. Укажите, пожалуйста, в какой валюте был перевод, чтобы я добавил это к обращению."], ["04:55", "client", "В тенге."], ["05:43", "operator", "Добавил. Когда по платежу будет ответ, мы сообщим вам в этом чате. Спасибо, что подождали. До свидания!"]], "ai": {"c1": {"a": "yes", "c": 0.97, "ev": [9], "why": "В первом ответе оператора после эскалации [9] есть приветствие на русском языке клиента («Здравствуйте») и имя («меня зовут Роман»)."}, "c2": {"a": "yes", "c": 0.8, "ev": [0, 4, 9, 12, 13], "why": "Оператор учёл, что клиент уже пополнил счёт с карты и ждёт проверки платежа, и не переспрашивал это. Он уточнил недостающую деталь — валюту перевода — и добавил её к обращению [12-14]."}, "c3": {"a": "yes", "c": 0.95, "ev": [9, 10, 11, 12], "why": "Запрос о непоступившем платеже требует проверки счёта, поэтому идентификация была нужна. Оператор запросил подтверждение личности [9], клиент согласился [10], система подтвердила личность [11]. Только после этого оператор передал вопрос специалистам [12], данные счёта до проверки не раскрывались."}, "c4": {"a": "20", "c": 0.8, "ev": [9, 12, 14], "why": "Клиент просил проверить отправленный платёж. Оператор подтвердил личность, передал вопрос специалистам, уточнил валюту перевода и добавил её к обращению. Он также сообщил, что ответ придёт в этот чат, так что следующий шаг понятен. Срок клиент не спрашивал, поэтому его отсутствие не снижает оценку."}, "c5": {"a": "yes", "c": 0.8, "ev": [9, 12, 14], "why": "Оператор вежлив и отреагировал на проблему клиента: в [9] признал переживание из-за платежа, затем передал вопрос специалистам и пообещал сообщить результат. Грубости или игнорирования нет, хотя фраза эмпатии короткая."}, "c6": {"a": "10", "c": 0.8, "ev": [9, 12, 14], "why": "Реплики оператора ясные, связные и грамотные. Порядок логичный: приветствие, подтверждение личности, уточнение валюты, итог с информацией о дальнейших действиях. Клиенту не приходилось переспрашивать. Паузы между репликами не оценивались."}, "c7": {"a": "yes", "c": 0.8, "ev": [14], "why": "В реплике [14] оператор подвёл итог: добавил данные в обращение и сообщил, что ответ по платежу придёт в этом чате (указано где). Затем попрощался («До свидания!»). Срок не назван, но канал уведомления указан, и прощание есть."}, "c8": {"a": "no", "c": 0.95, "ev": [9, 11, 12, 14], "why": "Оскорблений нет, платных услуг в обход компании оператор не предлагал. Данные о счёте клиента не раскрывались: личность подтверждена системой [11] до дальнейших действий, а оператор запрашивал только валюту перевода."}}, "gold": {"c1": "yes", "c2": "yes", "c3": "yes", "c4": "20", "c5": "yes", "c6": "10", "c7": "yes", "c8": "no"}, "unsure": []}, {"id": "p1-ru-009", "channel": "agent chat", "lang": "RU", "operator": "Руслан", "group": "Пополнение и вывод", "transcript": [["00:00", "client", "Вчера вывод работал, сегодня нет. Посмотрите, что с моим счётом?"], ["00:02", "bot", " 29:15.5014718+00:00", "system", "Запись и транскрибирование возобновлены."], ["2026-11-03T15:29:19.0764399+00:00", "client", "Ну в хабаровскомто."], ["2026-11-03T15:29:21.2631163+00:00", "operator", "Компания fernetbark и операции Здравствуйте, чем могу вам помочь?"], ["2026-11-03T15:29:30.3971045+00:00", "operator", "Да."], ["2026-11-03T15:29:50.9981441+00:00", "client", "Здравствуйте, мы с супругой на неё регистрируем, как его брокерский счёт пополнили простой Фридом в банке. И вот сейчас наш брокер Оксана просит в техподдержку позвонить. Мы зарегистрировались, но она говорит, что нужно было указать место гражданства Казахстан Кыргызстан то, что у супруги вид на жительство, а вы сможете сбросить нам приложение настройки, все как это правильно сделать?"], ["2026-11-03T15:29:56.0937951+00:00", "operator", "Так, а подскажете номер телефона, по которому регистрацию проходили?"], ["2026-11-03T15:29:58.0478396+00:00", "client", "А вот по этому же номеру."], ["2026-11-03T15:30:00.6028172+00:00", "operator", "Сейчас проверим."], ["2026-11-03T15:30:01.2823297+00:00", "client", "Аида усубалину."], ["2026-11-03T15:30:14.6516127+00:00", "operator", "Ей также можете, пожалуйста, подсказать, каким мы к вам обращаться."], ["2026-11-03T15:30:18.2556603+00:00", "client", "А меня эльмар, а вот супруга рядом аида."], ["2026-11-03T15:30:19.9363640+00:00", "client", "Здравствуйте."], ["2026-11-03T15:30:35.6714339+00:00", "client", "Нам удалить."], ["2026-11-03T15:30:38.7328671+00:00", "client", "Приложение может нам удалить его?"], ["2026-11-03T15:30:39.6179564+00:00", "operator", "Это очень приятно. Здравствуйте, можем удалить ваш домой счет, но это будет не сегодня, скорее всего, вам пока стоит не заходить в мобильное приложение некоторое время, и у нас появится возможность удаления дома счёта, после чего вы можете повторно пройти это вам пока."], ["2026-11-03T15:30:46.2477198+00:00", "operator", "Да, вы можете сейчас зайти в меню настройки и выйти с дома счёта."], ["2026-11-03T15:30:58.7734462+00:00", "client", "Часть секундочку Фридом я крестик делаю регистрацию, потом крестик назад. Теперь вижу меню, куда нам нужно настройки."], ["2026-11-03T15:31:00.6965129+00:00", "client", "Выход правильно?"], ["2026-11-03T15:31:01.7459865+00:00", "operator", "Настройки и там не знаю выход да."], ["2026-11-03T15:31:04.8139771+00:00", "client", "Выход выйти."], ["2026-11-03T15:31:16.9851022+00:00", "operator", "Да, таким образом, пока можете не захотеть ваш прямой счет, и в целом можете не заходить мобильное приложение некоторое время и если успеем сегодня."], ["2026-11-03T15:31:17.1518133+00:00", "client", "А через сколько мы можем?"], ["2026-11-03T15:31:20.1246975+00:00", "client", "Или завтра утром лучше."], ["2026-11-03T15:31:23.6261770+00:00", "operator", "Ли так?"], ["2026-11-03T15:31:29.6312444+00:00", "operator", "Сейчас можно сделать таким образом."], ["2026-11-03T15:31:36.9680791+00:00", "operator", "Точно, к сожалению, время не подскажем, когда у нас появится возможность, но обычно это это через 02:00."], ["2026-11-03T15:31:39.4236516+00:00", "operator", "Бывает возможным."], ["2026-11-03T15:31:41.2731981+00:00", "client", "А тогда завтра рано утром, мы попробуем правильно?"], ["2026-11-03T15:31:51.9282226+00:00", "client", "Угу."], ["2026-11-03T15:31:59.5495953+00:00", "operator", "Да, но перед тем как попробовать, вы можете обратиться к нам на линию, чтобы проверили, активен ли ваш прямой счет, и если завтра утром уже точно появится возможность удаления, специалист его удалит и после чего вы можете уже пройти регистрацию заново уже корректно."], ["2026-11-03T15:32:03.7033733+00:00", "operator", "Да, конечно, вот остались."], ["2026-11-03T15:32:06.2180623+00:00", "operator", "Дал."], ["2026-11-03T15:32:07.1428129+00:00", "client", "Угу всё понял, спасибо вам огромное. Вы сейчас этим займётесь правильно. Ну вот там напишите там то, что нужно правильно."], ["2026-11-03T15:32:18.6247374+00:00", "client", "Угу."], ["2026-11-03T15:32:22.0699836+00: /* ---------------- scoring (как в движке: N/A перераспределяет вес) ---------------- */
function answersOf(d){ const e=lastEval(d), crit=verOf(e.v).crit, a={}; crit.forEach(c=>a[c.id] = e.ov[c.id]?.a ?? e.ai[c.id]?.a ?? null); return a; }
function calc(crit, ans){
  let W=0; const raw={};
  crit.forEach(c=>{ if(!c.weight || c.type==="flag") return; const a=ans[c.id]; if(a==null || a==="na") return; W+=c.weight;
    if(c.type==="scale"){ const mx=Math.max(...c.answers.filter(x=>x!=="na").map(Number)); raw[c.id]=c.weight*Number(a)/mx; } else raw[c.id] = a==="yes" ? c.weight : 0; });
  if(!W) return {total:null, W:0, k:0, pts:{}, secs:[null,null,null]};
  const k=100/W, pts={}; let s=0; Object.keys(raw).forEach(id=>{pts[id]=raw[id]*k; s+=pts[id];});
  const secs=[0,1,2].map(si=>{ let g=0,m=0; crit.filter(c=>c.sec===si && c.weight && c.type!=="flag").forEach(c=>{ if(ans[c.id]==null||ans[c.id]==="na") return; g+=pts[c.id]; m+=c.weight*k; }); return m?{g,m}:null; });
  return {total:r2(s), W, k, pts, secs};
}
function scoreOf(d){ return calc(verOf(lastEval(d).v).crit, answersOf(d)).total; }
const isGross = d => answersOf(d).c8 === "yes";
function lowConf(d){ const e=lastEval(d); return Object.entries(e.ai).filter(([k,v])=>v.c < S.settings.conf && !e.ov[k]).map(([k])=>k); }
function failed(d, cid){ const a=answersOf(d)[cid], c=verOf(lastEval(d).v).crit.find(x=>x.id===cid); if(!c||a==null||a==="na") return false;
  if(c.type==="flag") return a==="yes"; if(c.type==="scale"){ const mx=Math.max(...c.answers.filter(x=>x!=="na").map(Number)); return Number(a)<mx; } return a==="no"; }
function ansLabel(c, a){ if(a==null) return "Не оценён"; if(a==="na") return "N/A"; if(c.type==="flag") return a==="yes"?"Обнаружена":"Нет";
  if(c.type==="scale"){ const mx=Math.max(...c.answers.filter(x=>x!=="na").map(Number)); return `${a} из ${mx}`; } return a==="yes"?"Да":"Нет"; }
function ansPill(c, a){ if(a==null) return `<span class="pill na">Не оценён</span>`; if(a==="na") return `<span class="pill na">N/A</span>`;
  if(c.type==="flag") return a==="yes"?`<span class="pill bad">Грубая ошибка</span>`:`<span class="pill ok">Нет</span>`;
  if(c.type==="scale"){ const mx=Math.max(...c.answers.filter(x=>x!=="na").map(Number)), v=Number(a); return `<span class="pill ${v===mx?"ok":v===0?"bad":"warn"}">${v} из ${mx}</span>`; }
  return a==="yes"?`<span class="pill ok">Да</span>`:`<span class="pill bad">Нет</span>`; }
const stPill = s => `<span class="pill ${ST[s][0]}"><span class="dot"></span>${ST[s][1]}</span>`;
const linkify = (t) => esc(t).replace(/\[(\d+)(?:\s*[-–]\s*(\d+))?\]/g, (m,a,b)=> b ? `<button class="evc" data-ev="${a}">#${+a+1}–${+b+1}</button>` : `<button class="evc" data-ev="${a}">#${+a+1}</button>`);

VIEWS.dialog = (el, id) => {

function hash(s){ let h=2166136261; for(const ch of s){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619);} return (h>>>0).toString(16).padStart(8,"0").slice(0,8); }

const SAMPLE = `Клиент: Здравствуйте, не могу пополнить счёт с карты, пишет ошибка.
Бот: Здравствуйте! Я AIM, AI-ассистент Freedom Broker. Соединяю с оператором.
Система: Эскалация на оператора.
Оператор: Здравствуйте! Меня зовут Алия. Подскажите, какой банк выпустил карту и какой текст ошибки вы видите?
Клиент: Kaspi, пишет «операция отклонена».
Оператор: Спасибо. Такое бывает, если банк карты блокирует операции с брокерами. Попробуйте пополнить через перевод по реквизитам: они есть в приложении в разделе «Пополнить».
Клиент: Понял, попробую.
Оператор: Если перевод не пройдёт, напишите нам, разберёмся. Хорошего дня!`;
function parseText(txt){
  const map = {"клиент":"client","client":"client","customer":"client","клиент:":"client","оператор":"operator","operator":"operator","agent":"operator","бот":"bot","bot":"bot","система":"system","system":"system"};
  const out=[], errs=[]; txt.split(/\n+/).forEach((line,i)=>{ const s=line.trim(); if(!s) return; const m=s.match(/^([^:]{2,20}):\s*(.+)$/);
    if(!m){ errs.push(`Строка ${i+1}: не указан говорящий. Начните строку с «Клиент:» или «Оператор:»`); return; }
    const sp=map[m[1].trim().toLowerCase()]; if(!sp){ errs.push(`Строка ${i+1}: неизвестный говорящий «${m[1].trim()}»`); return; }
    out.push([String(Math.floor(out.length/2)).padStart(2,"0")+":"+String((out.length*17)%60).padStart(2,"0"), sp, m[2].trim()]); });
  if(out.length && !out.some(x=>x[1]==="operator")) errs.push("В диалоге нет реплик оператора: оценивать нечего.");
  return {out, errs};
}

function heuristic(tr){
  const ops = tr.map((m,i)=>[i,m]).filter(([,m])=>m[1]==="operator"); const first=ops[0], lastO=ops[ops.length-1];
  const idv = tr.findIndex(m=>m[1]==="system" && /подтвержден|расталды|verified/i.test(m[2]));
  const greet = first && /здравств|сәлем|hello|hi\b|добр/i.test(first[1][2]) && /зовут|я [А-ЯЁ]|атым|name|I'm/i.test(first[1][2]);
  const bye = lastO && /свидан|хорошего|сау болыңыз|goodbye|have a/i.test(lastO[1][2]);
  const demo = " Демо: ответ получен правилами прототипа, в продукте его даёт модель.";
  const ask = ops.slice(0,3).find(([,m])=>/\?/.test(m[2]));
  const sorry = ops.find(([,m])=>/извин|понимаю|сожалени|кешіріңіз|түсінемін|sorry|understand/i.test(m[2]));
  const rude = ops.find(([,m])=>/сами виноват|не мои проблемы|читайте внимательн|ваша проблема|your problem/i.test(m[2]));
  const step = ops.slice(1).find(([,m])=>/раздел|приложени|перейдите|нажмите|оформ|заявк|реквизит|section|app|tap|click/i.test(m[2]));
  const avg = ops.length ? ops.reduce((s,[,m])=>s+m[2].length,0)/ops.length : 0;
  const c4 = !ops.length ? "0" : step ? (ops.length>=3?"20":"15") : ops.length>=3 ? "10" : "5";
  const c6 = avg>350 ? "4" : avg<25 ? "7" : "10";
  const sensitive = tr.some(m=>m[1]==="client" && /счёт|счет|баланс|вывод|паспорт|ИИН|шот|account|balance/i.test(m[2]));
  return {
    c1:{a:greet?"yes":"no", c:greet?.9:.78, ev:first?[first[0]]:[], why:(greet?"В первом ответе есть приветствие и имя.":"В первом ответе нет приветствия или имени.")+demo},
    c2:{a:ask?"yes":"no", c:ask?.82:.62, ev:ask?[ask[0]]:ops.slice(0,1).map(x=>x[0]), why:(ask?"Оператор задал уточняющий вопрос до ответа.":"Уточняющих вопросов до ответа не найдено.")+demo},
    c3:{a:idv>=0?"yes":sensitive?"no":"na", c:idv>=0?.92:sensitive?.6:.8, ev:idv>=0?[idv]:[], why:(idv>=0?"Личность подтверждена системным событием.":sensitive?"Клиент спрашивает о счёте, подтверждения личности в переписке нет.":"Защищённых действий и раскрытия данных счёта не найдено.")+demo},
    c4:{a:c4, c:step?.76:.64, ev:(step?[step]:ops.slice(1,3)).map(x=>x[0]), why:(step?"Оператор назвал конкретный следующий шаг.":"Конкретного следующего шага в ответах не найдено.")+demo},
    c5:{a:rude?"no":"yes", c:rude?.88:sorry?.86:.74, ev:(rude||sorry||first)?[(rude||sorry||first)[0]]:[], why:(rude?"Реплика перекладывает вину на клиента.":sorry?"Оператор признал неудобство клиента.":"Тон вежливый, грубости нет.")+demo},
    c6:{a:c6, c:c6==="10"?.8:.66, ev:ops.map(x=>x[0]).slice(0,3), why:(c6==="10"?"Ответы связные, по существу.":avg>350?"Ответы перегружены, суть теряется.":"Ответы слишком короткие, часть вопроса без пояснений.")+demo},
    c7:{a:bye?"yes":"no", c:.84, ev:lastO?[lastO[0]]:[], why:(bye?"Оператор предложил помощь и попрощался.":"Нет прощания или предложения помощи.")+demo},
    c8:{a:rude?"yes":"no", c:rude?.8:.9, ev:rude?[rude[0]]:[], why:(rude?"Некорректное выражение в адрес клиента.":"Грубых нарушений не найдено.")+demo}
  };
}

function agreement(){
  const crit=verOf(1).crit; let n=0,m=0; const per={};
  S.dialogs.forEach(d=>{ if(!d.gold||!Object.keys(d.gold).length) return; const ai=d.evals[0].ai; crit.forEach(c=>{ if(d.gold[c.id]==null||!ai[c.id]) return; n++; const ok=ai[c.id].a===d.gold[c.id]; if(ok) m++; per[c.id]=per[c.id]||[0,0]; per[c.id][0]++; if(ok) per[c.id][1]++; }); });
  return {total:n?Math.round(m/n*100):0, n, per};
}

     <div class="acts" style="justify-content:space-between"><h2>${c.id.slice(1)}. ${esc(c.name)}</h2>${dr?'<span class="pill warn">черновик</span>':'<span class="pill acc">v'+act.v+'</span>'}</div>
     ${dr?`<label class="l" for="cn">Название</label><input class="f" id="cn" value="${esc(c.name)}">
       <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><label class="l" for="ct">Тип ответа</label><select class="f" id="ct"><option value="binary" ${c.type==="binary"?"selected":""}>Да / Нет</option><option value="scale" ${c.type==="scale"?"selected":""}>Шкала</option><option value="flag" ${c.type==="flag"?"selected":""}>Флаг без баллов</option></select></div>
       <div><label class="l" for="csec">Секция</label><select class="f" id="csec">${SECS.map((s,i)=>`<option value="${i}" ${c.sec===i?"selected":""}>${s}</option>`).join("")}</select></div></div>
       <label class="l" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="cna" ${c.na?"checked":""}> Разрешён ответ N/A</label>
       <label class="l" for="cr">Правило: когда Да, Нет и N/A. Это инструкция для модели</label><textarea class="f" id="cr" style="min-height:180px">${esc(c.rule)}</textarea>
       <div class="acts" style="margin-top:12px"><button class="btn pri" id="csave">Сохранить в черновик</button>${!base.find(b=>b.id===c.id)?'<button class="btn danger" id="cdel">Удалить критерий</button>':""}</div>`
     :`<p style="color:var(--fg-2);margin-top:10px">${esc(c.rule)}</p><p class="sm muted" style="margin-top:12px">Чтобы изменить критерий, создайте черновик новой версии.</p>`}
     ${dr&&diffs.length?`<h3 style="margin-top:var(--s-xl)">Изменения относительно v${act.v}</h3><div class="diff" style="margin-top:8px">${diffs.map(df=>df.t==="add"?`<div class="p">+ Новый критерий ${df.id.slice(1)}. ${esc(df.x.name)}, вес ${df.x.weight}</div>`:df.ch.map(([k,a,b])=>`<div class="m">− ${df.id.slice(1)}. ${k}: ${esc(String(a).slice(0,140))}</div><div class="p">+ ${df.id.slice(1)}. ${k}: ${esc(String(b).slice(0,140))}</div>`).join("")).join("")}</div>`:""}
   </div></div></div>`;
  const cd=$("#cdraft"); if(cd) cd.onclick=()=>{ S.crit.draft={v:act.v+1, status:"draft", at:now(), by:me().name, crit:JSON.parse(JSON.stringify(act.crit))}; S.ui.cRes=null; log(`Создал черновик v${act.v+1}`, "Чаты"); save(); VIEWS.checklists(el); };
  $$("[data-cs]",el).forEach(r=>r.onclick=e=>{ if(e.target.closest("input")) return; S.ui.cSel=r.dataset.cs; save(); VIEWS.checklists(el); });
  $$("[data-cw]",el).forEach(i=>i.onchange=()=>{ const x=dr.crit.find(y=>y.id===i.dataset.cw); x.weight=Math.max(0,Math.min(100,Math.round(+i.value||0))); save(); VIEWS.checklists(el); });
  const cs=$("#csave"); if(cs) cs.onclick=()=>{ c.name=$("#cn").value.trim()||c.name; c.rule=$("#cr").value.trim(); c.sec=+$("#csec").value; c.na=$("#cna").checked; const t=$("#ct").value;
    if(t!==c.type){ c.type=t; c.answers = t==="scale"?["10","7","4","0"]:["yes","no"]; if(t==="flag") c.weight=0; } c.answers=c.answers.filter(a=>a!=="na"); if(c.na) c.answers.push("na"); save(); VIEWS.checklists(el); toast("Сохранено в черновик"); };
  const ca=$("#cadd"); if(ca) ca.onclick=()=>{ const n=Math.max(...dr.crit.map(x=>+x.id.slice(1)))+1; const nc={id:"c"+n, name:"Новый критерий", type:"binary", answers:["yes","no"], weight:0, na:false, rule:"Да — … Нет — …", sec:2}; dr.crit.splice(dr.crit.findIndex(x=>x.type==="flag"),0,nc); S.ui.cSel=nc.id; save(); VIEWS.checklists(el); };
  const cdl=$("#cdel"); if(cdl) cdl.onclick=()=>{ dr.crit=dr.crit.filter(x=>x.id!==c.id); S.ui.cSel=null; save(); VIEWS.checklists(el); };
  const cdr=$("#cdrop"); if(cdr) cdr.onclick=()=>{ S.crit.draft=null; save(); VIEWS.checklists(el); toast("Черновик удалён"); };
  const cp=$("#cpub"); if(cp) cp.onclick=()=>{ if(cp.getAttribute("aria-disabled")){ toast(sum!==100?"Сумма весов должна быть 100":"В черновике нет изменений"); return; }
    const before=S.dialogs.map(d=>[d.id,scoreOf(d)]); dr.status="published"; dr.at=now(); S.crit.versions.push(dr); S.crit.draft=null; log(`Опубликовал чек-лист v${dr.v}`, diffs.map(x=>x.id).join(", "));
    const weightOnly = diffs.filter(x=>x.t==="mod"&&x.ch.every(c=>c[0]==="Вес")).map(x=>x.id), needModel = diffs.filter(x=>x.t==="add"||x.ch.some(c=>c[0]!=="Вес")).map(x=>x.id);
    S.ui.cRes = `<h2>Версия v${dr.v} опубликована</h2><p class="muted" style="margin:4px 0 12px">Новые диалоги оцениваются по ней. Что сделать со старыми ${S.dialogs.length} оценками:</p>
      ${weightOnly.length?`<div class="box"><div class="h">Изменён вес: ${weightOnly.map(x=>x.slice(1)).join(", ")}</div><p class="sm">Ответы модели не меняются, пересчёт мгновенный и бесплатный.</p><div><button class="btn sm pri" id="rw">Пересчитать ${S.dialogs.length} оценок</button></div></div>`:""}
      ${needModel.length?`<div class="box" style="margin-top:8px"><div class="h">Изменена формулировка или добавлен критерий: ${needModel.map(x=>x.slice(1)).join(", ")}</div><p class="sm">Нужна переоценка моделью только этих критериев: ${S.dialogs.length} диалогов, около $${(S.dialogs.length*D.run.cost/8*needModel.length).toFixed(3).replace(".",",")}.</p><div><button class="btn sm" id="rm">Запустить переоценку</button></div></div>`:""}`;
    S.ui.cBefore=before; S.ui.cNeed=needModel; save(); renderShell("checklists"); toast(`Чек-лист v${dr.v} опубликован`); };
  const rw=$("#rw"); if(rw) rw.onclick=()=>{ const v2=activeV(); let changed=0; S.dialogs.forEach(d=>{ const e=lastEval(d); const ne={...JSON.parse(JSON.stringify(e)), n:e.n+1, v:v2.v, at:now(), cost:0, model:e.model+" · пересчёт весов"};
      v2.crit.forEach(c=>{ if(!ne.ai[c.id]) ne.ai[c.id]={a:null,c:0,ev:[],why:"Критерий добавлен в v"+v2.v+". Нужна переоценка моделью."}; }); d.evals.push(ne); d.events.push([now(),`Пересчитано по чек-листу v${v2.v} без вызова модели`]); });
    const after=S.dialogs.map(d=>scoreOf(d)); S.ui.cBefore.forEach(([id,b],i)=>{ if(b!==after[i]) changed++; });
    const avgB=r2(S.ui.cBefore.map(x=>x[1]).filter(x=>x!=null).reduce((a,b)=>a+b,0)/S.ui.cBefore.filter(x=>x[1]!=null).length), avgA=r2(after.filter(x=>x!=null).reduce((a,b)=>a+b,0)/after.filter(x=>x!=null).length);
    log(`Пересчитал оценки по v${v2.v}`, `${changed} изменились`); S.ui.cRes=`<h2>Пересчёт выполнен</h2><p style="margin-top:6px">Изменилось ${changed} оценок из ${S.dialogs.length}. Средний балл: ${fmt(avgB)} → ${fmt(avgA)}.</p><p class="sm muted" style="margin-top:6px">Старые оценки по v${v2.v-1} сохранены в истории каждого диалога.</p>${S.ui.cNeed?.length?`<div style="margin-top:10px"><button class="btn sm" id="rm">Переоценить моделью критерии ${S.ui.cNeed.map(x=>x.slice(1)).join(", ")}</button></div>`:""}`;
    save(); renderShell("checklists"); };
  const rm=$("#rm"); if(rm) rm.onclick=()=>{ const v2=activeV(); S.dialogs.forEach(d=>{ const e=lastEval(d); if(e.v!==v2.v){ const ne={...JSON.parse(JSON.stringify(e)), n:e.n+1, v:v2.v, at:now()}; d.evals.push(ne); }
      const ev=lastEval(d); (S.ui.cNeed||[]).forEach(cid=>{ const c=v2.crit.find(x=>x.id===cid); ev.ai[cid]={a:c.answers[0], c:.65, ev:[], why:"Демо: в прототипе ответ по изменённому критерию имитирован. В продукте модель переоценит только этот критерий."}; }); });
    S.ui.cRes=null; S.ui.cNeed=[]; save(); startJob(S.dialogs.slice(0,6).map(d=>d.id), `Переоценка по v${v2.v}`); };
};

VIEWS.admin = el => {
  el.innerHTML = `<div class="ph"><div><h1>Пользователи</h1><p>Роли определяют, что человек видит и может менять. В рабочей версии пользователи и группы приходят из Active Directory, здесь можно переопределить роль.</p></div><div class="acts"><button class="btn pri" id="uadd">Добавить пользователя</button></div></div>
   <div class="tw"><table class="t"><thead><tr><th>Сотрудник</th><th>Роль</th><th>Группа</th><th>Доступ</th></tr></thead><tbody>
   ${S.users.map(u=>`<tr><td>${esc(u.name)}</td><td><select class="f" style="height:30px;padding:0 6px;width:auto" data-ur="${u.id}" aria-label="Роль ${esc(u.name)}">${Object.entries(ROLE).map(([k,o])=>`<option value="${k}" ${u.role===k?"selected":""}>${o.t}</option>`).join("")}</select></td><td>${esc(u.group||"—")}</td>
     <td><button class="btn sm ${u.on?"":"pri"}" data-uon="${u.id}">${u.on?"Заблокировать":"Разблокировать"}</button></td></tr>`).join("")}</tbody></table></div>`;
  $$("[data-ur]",el).forEach(s=>s.onchange=()=>{ const u=S.users.find(x=>x.id===s.dataset.ur); log(`Сменил роль: ${u.name} → ${ROLE[s.value].t}`, u.id); u.role=s.value; save(); toast("Роль изменена, действует со следующего входа"); });
  $$("[data-uon]",el).forEach(b=>b.onclick=()=>{ const u=S.users.find(x=>x.id===b.dataset.uon); if(u.id===S.user){ toast("Нельзя заблокировать себя"); return; } u.on=!u.on; log(`${u.on?"Разблокировал":"Заблокировал"} ${u.name}`, u.id); save(); VIEWS.admin(el); });
  $("#uadd").onclick=()=>toast("В пилоте пользователи добавляются через группу AD «CQA-Users»");
};
VIEWS.model = el => {
  const st=S.settings;
  el.innerHTML = `<div class="ph"><div><h1>Модель и источники</h1><p>Модель подключается через единый интерфейс: облачная или локальная, без изменения чек-листа и интерфейса.</p></div></div>
   <div class="cols"><div class="panel"><h2>Модель оценки</h2>
     <label class="l" style="display:flex;gap:8px"><input type="radio" name="m" value="cloud" ${st.model==="cloud"?"checked":""}> Облачная (Sonnet) · ~$${D.run.cost.toFixed(3).replace(".",",")} за диалог, данные маскируются</label>
     <label class="l" style="display:flex;gap:8px;margin-top:4px"><input type="radio" name="m" value="local" ${st.model==="local"?"checked":""}> Локальная (Qwen, on-prem) · данные не покидают контур</label>
     <label class="l" for="sconf">Порог уверенности: ниже — на проверку QA · <b class="num" id="sconfv">${Math.round(st.conf*100)}%</b></label><input type="range" id="sconf" min="50" max="95" step="5" value="${Math.round(st.conf*100)}" style="width:100%">
     <label class="l" for="ssam">Случайная выборка для контроля AI · <b class="num" id="ssamv">${st.sample}%</b></label><input type="range" id="ssam" min="0" max="10" step="1" value="${st.sample}" style="width:100%">
     <div class="acts" style="margin-top:16px"><button class="btn pri" id="ssave">Сохранить</button></div></div>
   <div class="panel"><h2>Источники диалогов</h2><div class="tw" style="margin-top:12px"><table class="t"><tbody>
     <tr><td>Загрузка файлов JSON</td><td><span class="pill ok">Работает</span></td></tr><tr><td>Microsoft Dynamics 365 (чаты)</td><td><span class="pill na">Пилот</span></td></tr>
     <tr><td>Телефония и распознавание речи</td><td><span class="pill na">Пилот</span></td></tr><tr><td>Microsoft Entra ID (вход)</td><td><span class="pill na">Пилот</span></td></tr></tbody></table></div></div></div>`;

  $("#ssave").onclick=()=>{ st.model=$("input[name=m]:checked").value; st.conf=+$("#sconf").value/100; st.sample=+$("#ssam").value; log("Изменил настройки модели", `${st.model}, порог ${Math.round(st.conf*100)}%`); save(); renderShell("model"); toast("Настройки сохранены"); };
};

   <div class="tw"><table class="t"><thead><tr><th>Время</th><th>Сотрудник</th><th>Действие</th><th>Объект</th></tr></thead><tbody>
   ${S.audit.map(a=>`<tr><td class="num muted" style="white-space:nowrap">${a.at}</td><td>${esc(a.who)}</td><td>${esc(a.what)}</td><td class="num">${esc(a.obj)}</td></tr>`).join("")}</tbody></table></div>`;
